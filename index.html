<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UNI / WEEK</title><meta name="theme-color" content="#eee9df"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="UNI / WEEK"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/icon-192.png"><style>
:root{--bg:#eee9df;--ink:#171717;--paper:#faf8f2;--line:#b8b1a6;--accent:#ff5b35}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.25 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}.wrap{max-width:1500px;margin:auto;padding:28px}.top{display:flex;align-items:end;justify-content:space-between;border-bottom:2px solid;padding-bottom:16px}.brand{font-size:clamp(34px,5vw,74px);font-weight:900;letter-spacing:-.06em}.meta{text-align:right;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.actions{display:flex;gap:8px;margin:18px 0;align-items:center;flex-wrap:wrap}.viewtoggle{display:flex;gap:0;margin-left:auto}.viewtoggle button{padding:7px 10px}.viewtoggle button.active{background:var(--ink);color:#fff}.viewtoggle button:not(.active){background:transparent;color:var(--ink);border:1px solid}.weeknav{display:flex;align-items:center;gap:5px;margin-left:8px}.weeknav button{padding:7px 9px}.weeklabel{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:700;white-space:nowrap;margin-left:5px;text-align:left}button,input,select{font:inherit}button{background:var(--ink);color:white;border:0;padding:10px 14px;cursor:pointer}button.ghost{background:transparent;color:var(--ink);border:1px solid}.week{display:grid;grid-template-columns:58px repeat(5,1fr);border-top:1px solid;border-left:1px solid;min-width:850px}.scroll{overflow:auto}.cell,.day,.time{border-right:1px solid;border-bottom:1px solid}.day{height:42px;padding:6px 10px;font-weight:800;text-transform:uppercase;background:var(--paper);position:sticky;top:0;z-index:4;display:flex;align-items:center;gap:7px}.day small{font-size:10px;font-weight:600;opacity:.55}.day.todayhead{background:var(--ink);color:#fff}.day.todayhead small{opacity:.72}.time{height:72px;padding:5px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px}.slot{height:72px;position:relative;background:linear-gradient(to bottom,transparent 50%,rgba(0,0,0,.06) 50%,rgba(0,0,0,.06) 51%,transparent 51%)}.col{position:relative}.event{position:absolute;left:6px;right:6px;padding:8px;border:1.5px solid #111;background:var(--c,#d8e6ff);box-shadow:3px 3px 0 #111;overflow:hidden;cursor:pointer;z-index:2}.event b{display:block;font-size:15px;padding-right:20px}.event .roomline{display:block;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:800;margin-top:3px}.event .subline{display:block;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;opacity:.7}.event .more{position:absolute;right:6px;top:5px;opacity:0;font-weight:900;letter-spacing:1px}.event:hover .more{opacity:.65}.now{outline:2px solid var(--ink);outline-offset:-2px}.nowline{position:absolute;left:0;right:0;height:1px;background:var(--ink);z-index:3;pointer-events:none}.nowline:before{content:"";position:absolute;width:6px;height:6px;background:var(--ink);left:0;top:-2.5px}.nowline:after{content:attr(data-time);position:absolute;right:4px;top:-9px;background:var(--ink);color:var(--paper);padding:2px 4px;font:700 9px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.02em}dialog{border:2px solid;padding:0;box-shadow:8px 8px 0 #111;background:var(--paper);width:min(520px,calc(100vw - 32px));max-width:calc(100vw - 32px);max-height:calc(100dvh - 32px);overflow-x:hidden;overflow-y:auto}form{padding:20px;display:grid;gap:12px;min-width:0}label{display:grid;gap:5px;font-weight:700;min-width:0}input,select{padding:9px;border:1px solid;background:white;width:100%;min-width:0}.datefield:valid{font-weight:700}.colorcontrol{display:grid;grid-template-columns:52px 1fr;align-items:stretch;border:1px solid;background:#fff;min-height:38px;overflow:hidden}.colorcontrol input[type=color]{width:52px;height:100%;min-height:38px;padding:0;border:0;border-right:1px solid;background:transparent;cursor:pointer}.colorcontrol input[type=color]::-webkit-color-swatch-wrapper{padding:0}.colorcontrol input[type=color]::-webkit-color-swatch{border:0}.colorvalue{display:flex;align-items:center;padding:0 10px;font:700 11px ui-monospace,SFMono-Regular,Menlo,monospace;text-transform:uppercase}.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;min-width:0}.formactions{display:flex;justify-content:space-between;margin-top:8px}.danger{background:#b42525}.monthwrap{display:none}.monthwrap.active{display:block}.monthgrid{display:grid;grid-template-columns:repeat(7,1fr);border-left:1px solid;border-top:1px solid;min-width:800px}.monthdow,.monthday{border-right:1px solid;border-bottom:1px solid}.monthdow{height:32px;padding:7px 9px;font-weight:800;background:var(--paper);font-size:11px}.monthday{min-height:118px;padding:8px;background:var(--paper);cursor:pointer;position:relative}.monthday:hover{background:#f3efe6}.monthday.out{opacity:.35}.monthday.todaymonth .daynum{background:var(--ink);color:#fff}.daynum{display:inline-flex;min-width:24px;height:24px;align-items:center;justify-content:center;font:700 11px ui-monospace,SFMono-Regular,Menlo,monospace;margin-bottom:6px}.monthitem{display:block;margin:3px 0;padding:4px 5px;border-left:5px solid var(--c);font-size:10px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:#eee9df}.monthmore{font:10px ui-monospace,SFMono-Regular,Menlo,monospace;opacity:.55;margin-top:4px}.hint{opacity:.6;margin-top:14px;font-size:12px}.conditional[hidden]{display:none!important}.blocklist{display:grid;gap:8px}.blockrow{display:grid;grid-template-columns:1.25fr 1fr 1fr 1fr auto;gap:7px;align-items:end;padding:9px;border:1px solid var(--line);background:#fff}.blockrow label{font-size:10px}.blockrow button{height:38px;padding:8px 11px}.blockhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:24px}.blockhead button{padding:7px 10px}.muted{font:10px ui-monospace,SFMono-Regular,Menlo,monospace;opacity:.55}.localecontrol{position:relative;width:100%;min-width:0;background:#fff;border:1px solid}.localecontrol input[type=date],.localecontrol input[type=time]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;z-index:2}.localevalue{display:block;min-height:36px;padding:9px;font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.localevalue.empty{opacity:.45;font-weight:400}@media(max-width:700px){.blockrow{grid-template-columns:1fr 1fr}.blockrow .blockdate,.blockrow .blockroom{grid-column:span 2}.blockrow button{grid-column:2;justify-self:end}}@media(max-width:700px){.wrap{padding:14px}.brand{font-size:42px}.row{grid-template-columns:1fr}dialog{width:calc(100vw - 24px);max-width:calc(100vw - 24px);max-height:calc(100dvh - 24px)}form{padding:16px}.formactions{gap:10px;align-items:flex-end}.formactions>div{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}}
</style></head><body><main class="wrap"><header class="top"><div><div class="brand">UNI / WEEK</div><div>personal timetable — local only</div></div><div class="meta" id="date"></div></header><div class="actions"><button id="add">+ KURS</button><button class="ghost" id="clear">DIESE WOCHE LÖSCHEN</button><button class="ghost" id="backup">BACKUP</button><button class="ghost" id="restore">IMPORT</button><input id="restorefile" type="file" accept="application/json,.json" hidden><div class="viewtoggle"><button id="weekview" class="active">WOCHE</button><button id="monthview">MONAT</button></div><div class="weeknav"><button class="ghost" id="prev">←</button><button class="ghost" id="today">HEUTE</button><button class="ghost" id="next">→</button><div class="weeklabel" id="weeklabel"></div></div></div><div class="scroll" id="weekwrap"><div class="week" id="week"></div></div><div class="monthwrap scroll" id="monthwrap"><div class="monthgrid" id="monthgrid"></div></div><div class="hint">Kurs anklicken zum Bearbeiten · lokal auf diesem Gerät gespeichert · BACKUP für eine Sicherungsdatei.</div></main>
<dialog id="dlg"><form method="dialog" id="form"><h2 id="formtitle">KURS HINZUFÜGEN</h2><input type="hidden" id="id"><label>Kurs<input id="name" required placeholder="Figuratives Zeichnen"></label><label>Art<select id="repeat"><option value="once">Einmalig</option><option value="weekly">Jede Woche</option><option value="biweekly">Alle 2 Wochen</option><option value="block">Blocktermin</option></select></label><div id="normalfields"><div id="oncefields" class="conditional"><label>Datum<input class="datefield" id="eventdate" type="date" lang="de-DE"></label></div><div id="rangefields" class="row conditional" hidden><label>Startwoche<input class="datefield" id="eventweek" type="date" lang="de-DE"></label><label>Endwoche<input class="datefield" id="endeventweek" type="date" lang="de-DE"></label></div><div class="row"><label>Tag<select id="day"><option value="0">Montag</option><option value="1">Dienstag</option><option value="2">Mittwoch</option><option value="3">Donnerstag</option><option value="4">Freitag</option></select></label><label>Farbe<div class="colorcontrol"><input id="color" type="color" value="#c7d9ff"><span class="colorvalue" id="colorvalue">#C7D9FF</span></div></label></div><div class="row"><label>Start<input id="start" type="time" value="10:00" lang="de-DE"></label><label>Ende<input id="end" type="time" value="12:00" lang="de-DE"></label></div><div class="row"><label>Raum<input id="room" placeholder="2.15"></label><label>Dozent*in<input id="teacher" placeholder="optional"></label></div></div><div id="blockfields" class="conditional" hidden><div class="row"><label>Dozent*in<input id="blockteacher" placeholder="optional"></label><label>Farbe<div class="colorcontrol"><input id="blockcolor" type="color" value="#c7d9ff"><span class="colorvalue" id="blockcolorvalue">#C7D9FF</span></div></label></div><div class="blockhead"><div><b>TERMINE</b><div class="muted">Datum, Uhrzeit und Raum pro Tag</div></div><button type="button" class="ghost" id="addblock">+ TERMIN</button></div><div class="blocklist" id="blocklist"></div></div><div class="formactions"><button type="button" class="danger" id="del" hidden>LÖSCHEN</button><span></span><div><button type="button" class="ghost" id="cancel">ABBRECHEN</button> <button value="save">SPEICHERN</button></div></div></form></dialog>
<script>
const DAYS=['MO','DI','MI','DO','FR'], START=8, END=20, H=72;
let events=JSON.parse(localStorage.getItem('vic-uni-events-v2')||'null');
let legacy=JSON.parse(localStorage.getItem('vic-uni-events')||'[]');
const week=document.querySelector('#week'),dlg=document.querySelector('#dlg');
function mondayOf(date){let d=new Date(date);d.setHours(12,0,0,0);let day=d.getDay();d.setDate(d.getDate()-(day===0?6:day-1));return d}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
let currentWeek=mondayOf(new Date());let currentMonth=new Date();currentMonth=new Date(currentMonth.getFullYear(),currentMonth.getMonth(),1);let view='week';
if(!events){events=legacy.map(e=>({...e,week:iso(currentWeek)}));localStorage.setItem('vic-uni-events-v2',JSON.stringify(events))}
function mins(t){let[a,b]=t.split(':').map(Number);return a*60+b}
function save(){localStorage.setItem('vic-uni-events-v2',JSON.stringify(events));render()}
function weekDiff(a,b){return Math.round((mondayOf(b)-mondayOf(a))/(7*86400000))}
function occursInWeek(e){if(e.repeat==='block')return (e.slots||[]).some(x=>iso(mondayOf(new Date(x.date+'T12:00:00')))===iso(currentWeek));let start=new Date(e.week+'T12:00:00'),diff=weekDiff(start,currentWeek),r=e.repeat||'once';if(diff<0)return false;if(e.endweek&&weekDiff(currentWeek,new Date(e.endweek+'T12:00:00'))<0)return false;return r==='weekly'||(r==='biweekly'&&diff%2===0)||(r==='once'&&diff===0)}
function weekEvents(){let out=[];events.forEach(e=>{if(e.repeat==='block'){(e.slots||[]).forEach((x,i)=>{let d=new Date(x.date+'T12:00:00');if(iso(mondayOf(d))===iso(currentWeek)&&d.getDay()>=1&&d.getDay()<=5)out.push({...e,...x,day:d.getDay()-1,parentId:e.id,slotIndex:i})})}else if(occursInWeek(e))out.push(e)});return out}
function occursOnDate(e,d){if(e.repeat==='block')return (e.slots||[]).some(x=>x.date===iso(d));let targetMon=mondayOf(d), startMon=mondayOf(new Date(e.week+'T12:00:00'));let diff=weekDiff(startMon,targetMon),r=e.repeat||'once';if(diff<0)return false;if(e.endweek&&weekDiff(targetMon,new Date(e.endweek+'T12:00:00'))<0)return false;if(!(r==='weekly'||(r==='biweekly'&&diff%2===0)||(r==='once'&&diff===0)))return false;return +e.day===(d.getDay()-1)}
function eventsOnDate(d){let out=[];events.forEach(e=>{if(e.repeat==='block'){(e.slots||[]).filter(x=>x.date===iso(d)).forEach((x,i)=>out.push({...e,...x,parentId:e.id,slotIndex:i}))}else if(occursOnDate(e,d))out.push(e)});return out}
function render(){
  document.querySelector('#weekwrap').style.display=view==='week'?'block':'none';document.querySelector('#monthwrap').classList.toggle('active',view==='month');document.querySelector('#weekview').classList.toggle('active',view==='week');document.querySelector('#monthview').classList.toggle('active',view==='month');document.querySelector('#clear').style.display=view==='week'?'inline-block':'none';
  if(view==='month'){renderMonth();return}
  const endDate=new Date(currentWeek);endDate.setDate(endDate.getDate()+4);
  document.querySelector('#weeklabel').textContent=`${currentWeek.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'})} – ${endDate.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'})}`;
  let today=new Date();week.innerHTML='<div class="day"></div>'+DAYS.map((x,i)=>{let d=new Date(currentWeek);d.setDate(d.getDate()+i);let isToday=d.toDateString()===today.toDateString();return `<div class="day ${isToday?'todayhead':''}"><span>${x}</span><small>${d.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'})}</small></div>`}).join('');
  let times=document.createElement('div');for(let h=START;h<END;h++)times.innerHTML+=`<div class="time">${String(h).padStart(2,'0')}:00</div>`;week.append(times);
  let shown=weekEvents();
  for(let d=0;d<5;d++){let c=document.createElement('div');c.className='col';for(let h=START;h<END;h++)c.innerHTML+='<div class="slot"></div>';shown.filter(e=>+e.day===d).forEach(e=>{let el=document.createElement('div');el.className='event';el.style.setProperty('--c',e.color);el.style.top=((mins(e.start)-START*60)/60*H)+'px';el.style.height=Math.max(36,(mins(e.end)-mins(e.start))/60*H-5)+'px';el.innerHTML=`<span class="more">•••</span><b>${e.name}</b>${e.room?`<span class="roomline">RAUM ${e.room}</span>`:''}<span class="subline">${e.start}–${e.end} Uhr${e.teacher?' · '+e.teacher:''}</span>`;el.onclick=()=>openForm(e.parentId?events.find(x=>x.id===e.parentId):e);c.append(el)});week.append(c)}markNow()
}

function renderMonth(){
  document.querySelector('#weeklabel').textContent=currentMonth.toLocaleDateString('de-DE',{month:'long',year:'numeric'}).toUpperCase();
  const grid=document.querySelector('#monthgrid');grid.innerHTML=['MO','DI','MI','DO','FR','SA','SO'].map(x=>`<div class="monthdow">${x}</div>`).join('');
  let first=mondayOf(currentMonth), today=new Date();
  for(let i=0;i<42;i++){let d=new Date(first);d.setDate(first.getDate()+i);let cell=document.createElement('div');cell.className='monthday'+(d.getMonth()!==currentMonth.getMonth()?' out':'')+(d.toDateString()===today.toDateString()?' todaymonth':'');let dayEvents=eventsOnDate(d);cell.innerHTML=`<div class="daynum">${d.getDate()}</div>`+dayEvents.slice(0,3).map(e=>`<span class="monthitem" style="--c:${e.color}">${e.start}–${e.end} Uhr ${e.name}</span>`).join('')+(dayEvents.length>3?`<div class="monthmore">+${dayEvents.length-3} mehr</div>`:'');cell.onclick=()=>{currentWeek=mondayOf(d);view='week';render()};grid.append(cell)}
}

function getWeek(d){let x=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));let day=x.getUTCDay()||7;x.setUTCDate(x.getUTCDate()+4-day);let y=new Date(Date.UTC(x.getUTCFullYear(),0,1));return Math.ceil((((x-y)/86400000)+1)/7)}
function formatDEDate(v){if(!v)return 'TT.MM.JJJJ';let [y,m,d]=v.split('-');return `${d}.${m}.${y}`}
function formatDETime(v){return v?`${v} Uhr`:'HH:MM Uhr'}
function enhanceLocaleInput(input){if(!input||input.dataset.localeEnhanced)return;input.dataset.localeEnhanced='1';let wrap=document.createElement('div');wrap.className='localecontrol';let span=document.createElement('span');span.className='localevalue';input.parentNode.insertBefore(wrap,input);wrap.append(input,span);let refresh=()=>{let isDate=input.type==='date';span.textContent=isDate?formatDEDate(input.value):formatDETime(input.value);span.classList.toggle('empty',!input.value)};input.addEventListener('input',refresh);input.addEventListener('change',refresh);input._refreshLocale=refresh;refresh()}
function enhanceLocaleInputs(root=document){root.querySelectorAll('input[type=date],input[type=time]').forEach(enhanceLocaleInput)}
function refreshLocaleInputs(root=document){root.querySelectorAll('input[type=date],input[type=time]').forEach(x=>x._refreshLocale?.())}
function addBlockRow(slot={}){let row=document.createElement('div');row.className='blockrow';row.innerHTML=`<label class="blockdate">Datum<input class="datefield bdate" type="date" lang="de-DE" value="${slot.date||iso(currentWeek)}" required></label><label>Start<input class="bstart" type="time" lang="de-DE" value="${slot.start||'10:00'}" required></label><label>Ende<input class="bend" type="time" lang="de-DE" value="${slot.end||'12:00'}" required></label><label class="blockroom">Raum<input class="broom" value="${slot.room||''}" placeholder="optional"></label><button type="button" class="ghost bremove">×</button>`;row.querySelector('.bremove').onclick=()=>{if(document.querySelectorAll('.blockrow').length>1)row.remove()};row.querySelector('.datefield').addEventListener('change',ev=>ev.target.blur());document.querySelector('#blocklist').append(row);enhanceLocaleInputs(row)}
function updateFormMode(){let r=document.querySelector('#repeat').value,isBlock=r==='block',isRange=r==='weekly'||r==='biweekly';document.querySelector('#normalfields').hidden=isBlock;document.querySelector('#blockfields').hidden=!isBlock;document.querySelector('#oncefields').hidden=isBlock||isRange;document.querySelector('#rangefields').hidden=!isRange;document.querySelector('#eventdate').required=!isBlock&&!isRange;document.querySelector('#eventweek').required=isRange;document.querySelector('#endeventweek').required=isRange;document.querySelector('#start').required=!isBlock;document.querySelector('#end').required=!isBlock}
function openForm(e){document.querySelector('#form').reset();document.querySelector('#id').value=e?.id||'';document.querySelector('#name').value=e?.name||'';document.querySelector('#repeat').value=e?.repeat||'once';document.querySelector('#day').value=e?.day||0;document.querySelector('#start').value=e?.start||'10:00';document.querySelector('#end').value=e?.end||'12:00';document.querySelector('#room').value=e?.room||'';document.querySelector('#teacher').value=e?.teacher||'';let c=e?.color||'#c7d9ff';document.querySelector('#color').value=c;document.querySelector('#colorvalue').textContent=c.toUpperCase();document.querySelector('#blockcolor').value=c;document.querySelector('#blockcolorvalue').textContent=c.toUpperCase();document.querySelector('#blockteacher').value=e?.teacher||'';let base=e?.week||iso(currentWeek);document.querySelector('#eventweek').value=base;document.querySelector('#endeventweek').value=e?.endweek||base;let onceDate=base;if(e&&e.repeat==='once'){let dd=new Date(base+'T12:00:00');dd.setDate(dd.getDate()+(+e.day||0));onceDate=iso(dd)}document.querySelector('#eventdate').value=onceDate;document.querySelector('#blocklist').innerHTML='';if(e?.repeat==='block'&&e.slots?.length)e.slots.forEach(addBlockRow);else addBlockRow();updateFormMode();document.querySelector('#del').hidden=!e;document.querySelector('#formtitle').textContent=e?'KURS BEARBEITEN':'KURS HINZUFÜGEN';enhanceLocaleInputs(document.querySelector('#form'));refreshLocaleInputs(document.querySelector('#form'));dlg.showModal()}
document.querySelector('#add').onclick=()=>openForm();document.querySelector('#cancel').onclick=()=>dlg.close();
document.querySelector('#repeat').addEventListener('change',updateFormMode);document.querySelector('#addblock').onclick=()=>addBlockRow();
document.querySelectorAll('.datefield').forEach(el=>el.addEventListener('change',()=>el.blur()));document.querySelector('#eventweek').addEventListener('change',e=>{let end=document.querySelector('#endeventweek');if(!end.value||end.value<e.target.value)end.value=e.target.value});document.querySelector('#color').addEventListener('input',e=>document.querySelector('#colorvalue').textContent=e.target.value.toUpperCase());document.querySelector('#blockcolor').addEventListener('input',e=>document.querySelector('#blockcolorvalue').textContent=e.target.value.toUpperCase());
document.querySelector('#form').onsubmit=e=>{e.preventDefault();let eid=document.querySelector('#id').value||crypto.randomUUID(),r=document.querySelector('#repeat').value,x;if(r==='block'){let slots=[...document.querySelectorAll('.blockrow')].map(row=>({date:row.querySelector('.bdate').value,start:row.querySelector('.bstart').value,end:row.querySelector('.bend').value,room:row.querySelector('.broom').value}));if(slots.some(z=>!z.date||!z.start||!z.end||mins(z.end)<=mins(z.start))){alert('Bitte prüfe Datum und Uhrzeiten deiner Blocktermine.');return}x={id:eid,name:document.querySelector('#name').value,teacher:document.querySelector('#blockteacher').value,color:document.querySelector('#blockcolor').value,repeat:'block',slots}}else if(r==='once'){let d=new Date(document.querySelector('#eventdate').value+'T12:00:00');if(!document.querySelector('#eventdate').value||d.getDay()===0||d.getDay()===6){alert('Bitte wähle einen Termin von Montag bis Freitag.');return}x={id:eid,name:document.querySelector('#name').value,day:d.getDay()-1,start:document.querySelector('#start').value,end:document.querySelector('#end').value,room:document.querySelector('#room').value,teacher:document.querySelector('#teacher').value,color:document.querySelector('#color').value,week:iso(mondayOf(d)),endweek:iso(mondayOf(d)),repeat:'once'}}else{let selected=mondayOf(new Date(document.querySelector('#eventweek').value+'T12:00:00')),selectedEnd=mondayOf(new Date(document.querySelector('#endeventweek').value+'T12:00:00'));if(selectedEnd<selected){alert('Die Endwoche muss nach der Startwoche liegen.');return}x={id:eid,name:document.querySelector('#name').value,day:document.querySelector('#day').value,start:document.querySelector('#start').value,end:document.querySelector('#end').value,room:document.querySelector('#room').value,teacher:document.querySelector('#teacher').value,color:document.querySelector('#color').value,week:iso(selected),endweek:iso(selectedEnd),repeat:r}}let i=events.findIndex(v=>v.id===eid);i<0?events.push(x):events[i]=x;dlg.close();save()};
document.querySelector('#del').onclick=()=>{events=events.filter(e=>e.id!==id.value);dlg.close();save()};
document.querySelector('#clear').onclick=()=>{if(confirm('Wirklich alle Kurse dieser Woche löschen?')){events=events.filter(e=>e.week!==iso(currentWeek));save()}};
document.querySelector('#weekview').onclick=()=>{view='week';render()};document.querySelector('#monthview').onclick=()=>{view='month';currentMonth=new Date(currentWeek.getFullYear(),currentWeek.getMonth(),1);render()};document.querySelector('#prev').onclick=()=>{if(view==='week')currentWeek.setDate(currentWeek.getDate()-7);else currentMonth=new Date(currentMonth.getFullYear(),currentMonth.getMonth()-1,1);render()};document.querySelector('#next').onclick=()=>{if(view==='week')currentWeek.setDate(currentWeek.getDate()+7);else currentMonth=new Date(currentMonth.getFullYear(),currentMonth.getMonth()+1,1);render()};document.querySelector('#today').onclick=()=>{currentWeek=mondayOf(new Date());currentMonth=new Date(new Date().getFullYear(),new Date().getMonth(),1);render()};
function markNow(){
  document.querySelectorAll('.event').forEach(x=>x.classList.remove('now'));
  document.querySelectorAll('.nowline').forEach(x=>x.remove());
  let n=new Date();if(iso(mondayOf(n))!==iso(currentWeek))return;
  let d=n.getDay()-1,m=n.getHours()*60+n.getMinutes();if(d<0||d>4)return;
  let shown=weekEvents().filter(e=>+e.day===d);
  let active=shown.find(e=>m>=mins(e.start)&&m<=mins(e.end));
  if(active){let idx=shown.findIndex(e=>(e.parentId||e.id)===(active.parentId||active.id)&&e.start===active.start);document.querySelectorAll('.col')[d]?.querySelectorAll('.event')[idx]?.classList.add('now')}
  if(m>=START*60&&m<=END*60){let line=document.createElement('div');line.className='nowline';line.dataset.time=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');line.style.top=((m-START*60)/60*H)+'px';document.querySelectorAll('.col')[d]?.append(line)}
}

async function makeStoragePersistent(){try{if(navigator.storage?.persist)await navigator.storage.persist()}catch(e){}}
makeStoragePersistent();
if('serviceWorker' in navigator && location.protocol!=='file:') window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));
document.querySelector('#backup').onclick=()=>{const blob=new Blob([JSON.stringify({app:'UNI / WEEK',version:1,exportedAt:new Date().toISOString(),events},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='uni-week-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
document.querySelector('#restore').onclick=()=>document.querySelector('#restorefile').click();
document.querySelector('#restorefile').onchange=async ev=>{const f=ev.target.files?.[0];if(!f)return;try{const data=JSON.parse(await f.text());const imported=Array.isArray(data)?data:data.events;if(!Array.isArray(imported))throw new Error();if(confirm(`${imported.length} Kurse importieren und aktuelle Daten ersetzen?`)){events=imported;save()}}catch(e){alert('Das sieht nicht nach einem gültigen UNI / WEEK Backup aus.')}ev.target.value=''};

enhanceLocaleInputs(document.querySelector('#form'));let n=new Date();date.innerHTML=`${n.toLocaleDateString('de-DE',{weekday:'long'}).toUpperCase()}<br>${n.toLocaleDateString('de-DE')}`;render();setInterval(markNow,60000);
</script></body></html>
